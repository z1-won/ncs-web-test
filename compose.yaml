name: ncs-review

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ncs_review
      POSTGRES_USER: ncs_admin
      POSTGRES_PASSWORD: ${NCS_DB_ADMIN_PASSWORD:?Set NCS_DB_ADMIN_PASSWORD in .env}
      NCS_DB_PASSWORD: ${NCS_DB_PASSWORD:?Set NCS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 그림 속 글자 읽기(PaddleOCR) 이미지. 띄워 두는 서비스가 아니다 — 검수 서버가 그림을 읽을 때 docker run으로 잠깐 쓴다
  # (.env의 FIG_OCR_DOCKER=ncs-ocr). 만들기: docker compose build ocr   설명: docs/WEB.md '그림 속 글자 읽기'
  ocr:
    image: ncs-ocr:latest
    build:
      context: .
      dockerfile: docker/ocr/Dockerfile
    profiles: ["build"]          # docker compose up 으로는 뜨지 않는다
    network_mode: none

volumes:
  postgres_data:
