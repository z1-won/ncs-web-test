# main에 올리거나 PR을 열 때 테스트와 화면 빌드를 돌린다.
# 로컬에서 같은 검사: pip install -e ".[test]" && python -m unittest discover tests / (webapp/frontend) npm run lint && npm run build
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: 검수 엔진·서버 테스트
    runs-on: ubuntu-latest
    # 통합 테스트(tests/integration/test_postgres_integration.py)용 일회용 DB. 테스트 전용 값이며 실제 접속 정보가 아니다.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ncs_test
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ncs_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NCS_TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/ncs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # 웹 의존성 고정 버전을 검증한 버전(README)
          cache: pip
          cache-dependency-path: |
            requirements/web.txt
            requirements/test.txt
      - name: 설치
        run: pip install -e ".[test]"
      - name: 테스트 (단위·골든·계약·계층·DB 통합)
        run: python -m unittest discover tests

  frontend:
    name: 화면 lint·빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
